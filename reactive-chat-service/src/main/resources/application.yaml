server:
  port: ${SERVER.PORT}

spring:
  data:
    mongodb:
      uri: ${SPRING.DATA.MONGODB.URI}
    redis:
      host: ${SPRING.DATA.REDIS.HOST}
      port: ${SPRING.DATA.REDIS.PORT}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT.ENDPOINTS.WEB.EXPOSURE.INCLUDE}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT.ENDPOINT.HEALTH.PROBES.ENABLED}
  metrics:
    tags:
      application: ${MANAGEMENT.METRICS.TAGS.APPLICATION}

chat:
  # 0 means Runtime.availableProcessors()
  session-worker-pool-size: ${CHAT.SESSION_WORKER_POOL_SIZE}
  outbound:
    buffer-size: ${CHAT.OUTBOUND.BUFFER_SIZE}
  history:
    reconnect-limit: ${CHAT.HISTORY.RECONNECT_LIMIT}
  rate-limit:
    enabled: ${CHAT.RATE_LIMIT.ENABLED}
    key-prefix: ${CHAT.RATE_LIMIT.KEY_PREFIX}
    capacity: ${CHAT.RATE_LIMIT.CAPACITY}
    refill-tokens: ${CHAT.RATE_LIMIT.REFILL_TOKENS}
    refill-period: ${CHAT.RATE_LIMIT.REFILL_PERIOD}
    ttl: ${CHAT.RATE_LIMIT.TTL}
