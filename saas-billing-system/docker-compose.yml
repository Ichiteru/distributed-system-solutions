services:
  subscription-postgres:
    image: postgres:16
    container_name: saas-billing-subscription-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: subscription_service_db
      POSTGRES_USER: subscription_service_user
      POSTGRES_PASSWORD: subscription_service_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription_service_user -d subscription_service_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  billing-postgres:
    image: postgres:16
    container_name: saas-billing-billing-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: billing_service_db
      POSTGRES_USER: billing_service_user
      POSTGRES_PASSWORD: billing_service_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_service_user -d billing_service_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  orchestrator-postgres:
    image: postgres:16
    container_name: saas-billing-orchestrator-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: orchestrator_service_db
      POSTGRES_USER: orchestrator_service_user
      POSTGRES_PASSWORD: orchestrator_service_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator_service_user -d orchestrator_service_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  payment-postgres:
    image: postgres:16
    container_name: saas-billing-payment-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: payment_service_db
      POSTGRES_USER: payment_service_user
      POSTGRES_PASSWORD: payment_service_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_service_user -d payment_service_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.4
    container_name: saas-billing-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.9.4
    container_name: saas-billing-kafka
    depends_on:
      - zookeeper
    restart: on-failure
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.9.4
    container_name: saas-billing-kafka-init-topics
    depends_on:
      - kafka
    restart: "no"
    entrypoint:
      - /bin/bash
      - /etc/kafka/create-topics.sh
    environment:
      BOOTSTRAP_SERVER: kafka:9092
      TOPICS_FILE: /etc/kafka/topics.yaml
    volumes:
      - ./deploy/kafka/create-topics.sh:/etc/kafka/create-topics.sh:ro
      - ./deploy/kafka/topics.yaml:/etc/kafka/topics.yaml:ro

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.4
    container_name: saas-billing-schema-registry
    depends_on:
      - kafka
      - kafka-init-topics
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  wiremock:
    image: wiremock/wiremock:3.9.2
    container_name: saas-billing-wiremock
    ports:
      - "8089:8080"
    command:
      - --global-response-templating
    volumes:
      - ./deploy/wiremock:/home/wiremock:ro

  subscription-service:
    build:
      context: ..
      dockerfile: saas-billing-system/deploy/services/Dockerfile
      args:
        MODULE: ":saas-billing-system:subscription-service"
    image: saas-billing/subscription-service:local
    container_name: saas-billing-subscription-service
    restart: on-failure
    depends_on:
      subscription-postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  billing-service:
    build:
      context: ..
      dockerfile: saas-billing-system/deploy/services/Dockerfile
      args:
        MODULE: ":saas-billing-system:billing-service"
    image: saas-billing/billing-service:local
    container_name: saas-billing-billing-service
    restart: on-failure
    depends_on:
      billing-postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  billing-orchestrator:
    build:
      context: ..
      dockerfile: saas-billing-system/deploy/services/Dockerfile
      args:
        MODULE: ":saas-billing-system:billing-orchestrator"
    image: saas-billing/billing-orchestrator:local
    container_name: saas-billing-billing-orchestrator
    restart: on-failure
    depends_on:
      orchestrator-postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  payment-service:
    build:
      context: ..
      dockerfile: saas-billing-system/deploy/services/Dockerfile
      args:
        MODULE: ":saas-billing-system:payment-service"
    image: saas-billing/payment-service:local
    container_name: saas-billing-payment-service
    restart: on-failure
    depends_on:
      payment-postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
      wiremock:
        condition: service_started
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  kafka-connect:
    build:
      context: ..
      dockerfile: saas-billing-system/deploy/cdc/connect/Dockerfile
    container_name: saas-billing-kafka-connect
    depends_on:
      kafka:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully
      subscription-postgres:
        condition: service_healthy
      billing-postgres:
        condition: service_healthy
      orchestrator-postgres:
        condition: service_healthy
      payment-postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_EXACTLY_ONCE_SOURCE_SUPPORT: enabled
      CONNECT_PRODUCER_ACKS: all
      CONNECT_PRODUCER_ENABLE_IDEMPOTENCE: "true"

  kafka-connect-init:
    image: python:3.12-alpine
    container_name: saas-billing-kafka-connect-init
    depends_on:
      - kafka-connect
    restart: "no"
    entrypoint:
      - python3
      - /etc/kafka-connect/register-connectors.py
    environment:
      CONNECT_URL: http://kafka-connect:8083
      CONNECTORS_DIR: /etc/kafka-connect/connectors
      CONNECT_READY_TIMEOUT_SECONDS: 60
    volumes:
      - ./deploy/cdc/register-connectors.py:/etc/kafka-connect/register-connectors.py:ro
      - ./deploy/cdc:/etc/kafka-connect/connectors:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: saas-billing-kafka-ui
    depends_on:
      - kafka
      - kafka-init-topics
      - schema-registry
      - kafka-connect
      - kafka-connect-init
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: saas-billing
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: kafka-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
