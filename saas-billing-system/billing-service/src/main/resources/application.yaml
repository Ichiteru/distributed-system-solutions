server:
  port: ${SERVER.PORT}

spring:
  application:
    name: ${SPRING.APPLICATION.NAME}
  datasource:
    url: ${SPRING.DATASOURCE.URL}
    username: ${SPRING.DATASOURCE.USERNAME}
    password: ${SPRING.DATASOURCE.PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING.KAFKA.BOOTSTRAP_SERVERS}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: false
      enable-auto-commit: false
      max-poll-records: 10
      isolation-level: read_committed
    properties:
      schema.registry.url: ${SPRING.KAFKA.PROPERTIES.SCHEMA.REGISTRY.URL}

billing:
  kafka:
    dlt:
      retry:
        backoff-ms: ${BILLING.KAFKA.DLT.RETRY.BACKOFF_MS}
        max-attempts: ${BILLING.KAFKA.DLT.RETRY.MAX_ATTEMPTS}
    topics:
      commands:
        name: ${BILLING.KAFKA.TOPICS.COMMANDS.NAME}
      commands-dlt:
        name: ${BILLING.KAFKA.TOPICS.COMMANDS_DLT.NAME}
      events:
        name: ${BILLING.KAFKA.TOPICS.EVENTS.NAME}
