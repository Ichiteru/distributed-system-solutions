SERVER:
  PORT: 8085

SPRING:
  APPLICATION:
    NAME: billing-orchestrator
  DATASOURCE:
    URL: jdbc:postgresql://orchestrator-postgres:5432/orchestrator_service_db
    USERNAME: orchestrator_service_user
    PASSWORD: orchestrator_service_password
  KAFKA:
    BOOTSTRAP_SERVERS: kafka:9092
    PROPERTIES:
      SCHEMA:
        REGISTRY:
          URL: http://schema-registry:8081

ORCHESTRATOR:
  KAFKA:
    DLT:
      RETRY:
        BACKOFF_MS: 1000
        MAX_ATTEMPTS: 3
    TOPICS:
      SUBSCRIPTION_EVENTS: subscription.events
      SUBSCRIPTION_EVENTS_DLT: subscription.events.dlt
      BILLING_EVENTS: billing.events
      BILLING_EVENTS_DLT: billing.events.dlt
      PAYMENT_EVENTS: payment.events
      PAYMENT_EVENTS_DLT: payment.events.dlt
