server:
  port: ${SERVER.PORT}

spring:
  application:
    name: ${SPRING.APPLICATION.NAME}
  datasource:
    url: ${SPRING.DATASOURCE.URL}
    username: ${SPRING.DATASOURCE.USERNAME}
    password: ${SPRING.DATASOURCE.PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING.KAFKA.BOOTSTRAP_SERVERS}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      enable-auto-commit: false
      max-poll-records: 10
      isolation-level: read_committed
    properties:
      schema.registry.url: ${SPRING.KAFKA.PROPERTIES.SCHEMA.REGISTRY.URL}

orchestrator:
  kafka:
    topics:
      subscription-events: ${ORCHESTRATOR.KAFKA.TOPICS.SUBSCRIPTION_EVENTS}
      billing-events: ${ORCHESTRATOR.KAFKA.TOPICS.BILLING_EVENTS}
      payment-events: ${ORCHESTRATOR.KAFKA.TOPICS.PAYMENT_EVENTS}
  sagas:
    initial-subscription-billing:
      start-event: SubscriptionCreatedEvent
      initial-status: STARTED
      terminal-statuses:
        - COMPLETED
      business-key-path: $.payload.subscriptionId
      transitions:
        - from: STARTED
          "on": SubscriptionCreatedEvent
          to: INITIAL_INVOICE_REQUESTED
          emit:
            topic: billing.commands
            type: CreateInitialInvoice
        - from: INITIAL_INVOICE_REQUESTED
          "on": InvoiceCreatedEvent
          to: PAYMENT_REQUESTED
          emit:
            topic: payment.commands
            type: SubmitPayment
            aggregate-id-path: $.payload.invoiceId
        - from: PAYMENT_REQUESTED
          "on": PaymentSucceededEvent
          to: INVOICE_PAID_REQUESTED
          emit:
            topic: billing.commands
            type: MarkInvoicePaid
            aggregate-type: invoice
            aggregate-id-path: $.payload.invoiceId
        - from: PAYMENT_REQUESTED
          "on": PaymentFailedEvent
          to: INVOICE_PAYMENT_PENDING_REQUESTED
          emit:
            topic: billing.commands
            type: MarkInvoicePaymentPending
            aggregate-type: invoice
            aggregate-id-path: $.payload.invoiceId
        - from: INVOICE_PAID_REQUESTED
          "on": InvoicePaidEvent
          to: ACTIVATION_REQUESTED
          emit:
            topic: subscription.commands
            type: ActivateSubscription
            aggregate-type: subscription
            aggregate-id-path: $.payload.subscriptionId
        - from: INVOICE_PAYMENT_PENDING_REQUESTED
          "on": InvoicePaymentPendingEvent
          to: SUSPEND_SUBSCRIPTION_REQUESTED
        - from: ACTIVATION_REQUESTED
          "on": SubscriptionActivatedEvent
          to: COMPLETED
